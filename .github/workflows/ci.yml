name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.10.1
      - if: runner.os != 'Linux'
        run: go test -race ./...
      # Coverage is enforced on Linux, which has the pseudo-terminals the prompt tests need. Those skip
      # under -race, which bubbletea's input reader trips on exit, so this run goes without it. cmd/ is
      # left out: main only wires signals to cli.Main, which the tests drive directly.
      - if: runner.os == 'Linux'
        run: |
          # -count=1: cached results keep coverage blocks from before a change to another package.
          go test -count=1 -coverpkg=./cveservices/...,./internal/... -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1 | grep -q '100.0%' || {
            go tool cover -func=cover.out | grep -v '100.0%'
            exit 1
          }

  macos-app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: swift format lint --strict -r Sources Tests Package.swift
      # CvedexKit holds the logic and is held to 100%. CvedexMac is SwiftUI views over it.
      - run: |
          swift test --enable-code-coverage
          report=$(swift test --show-codecov-path)
          filter='.data[0].files[] | select(.filename | contains("/Sources/CvedexKit/"))'
          jq -r "$filter | \"\(.summary.lines.percent) \(.filename)\"" "$report"
          jq -e "[$filter | .summary.lines.percent == 100] | all" "$report" > /dev/null
      - run: ./build.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uvx zensical@0.0.71 build --clean

  docs-preview:
    name: Docs preview (Cloudflare)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    permissions:
      contents: read
      pull-requests: write
    # Its own environment and token, so a pull request never sees the token that deploys cvedexd.
    environment:
      name: docs-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uvx zensical@0.0.71 build --clean
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: deploy
        if: ${{ env.HAS_CLOUDFLARE_TOKEN == 'true' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --tag pr-${{ github.event.pull_request.number }}
      - name: Comment preview URL
        if: ${{ steps.deploy.outcome == 'success' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          message: |
            **Docs preview:** ${{ steps.deploy.outputs.deployment-url }}

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

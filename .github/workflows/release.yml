name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64/x86_64-linux linux/arm64/aarch64-linux darwin/amd64/x86_64-macos \
            darwin/arm64/aarch64-macos windows/amd64/x86_64-windows; do
            IFS=/ read -r GOOS GOARCH name <<< "$target"
            export GOOS GOARCH
            out="out/$name"
            go build -trimpath -o "$out/" \
              -ldflags "-s -w -X github.com/Kludex/cvedex/internal/cli.Version=${GITHUB_REF_NAME}" ./cmd/cvedex
            archive="cvedex-${GITHUB_REF_NAME}-${name}"
            if [[ "$GOOS" == windows ]]; then
              (cd "$out" && zip -q "../../dist/$archive.zip" cvedex.exe)
            else
              tar -C "$out" -czf "dist/$archive.tar.gz" cvedex
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

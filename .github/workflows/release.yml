name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64/x86_64-linux linux/arm64/aarch64-linux darwin/amd64/x86_64-macos \
            darwin/arm64/aarch64-macos windows/amd64/x86_64-windows; do
            IFS=/ read -r GOOS GOARCH name <<< "$target"
            export GOOS GOARCH
            out="out/$name"
            go build -trimpath -o "$out/" \
              -ldflags "-s -w -X github.com/Kludex/cvedex/internal/cli.Version=${GITHUB_REF_NAME}" ./cmd/cvedex
            archive="cvedex-${GITHUB_REF_NAME}-${name}"
            if [[ "$GOOS" == windows ]]; then
              (cd "$out" && zip -q "../../dist/$archive.zip" cvedex.exe)
            else
              tar -C "$out" -czf "dist/$archive.tar.gz" cvedex
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cvedex-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uvx zensical@0.0.71 build --clean
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

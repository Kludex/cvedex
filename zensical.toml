[project]
site_name = "cvedex"
site_description = "A CVE Services client for CNAs, and a policy server to share it safely."
repo_url = "https://github.com/Kludex/cvedex"
repo_name = "Kludex/cvedex"
copyright = "Copyright &copy; 2026 Marcelo Trylesinski"
nav = [
  { "cvedex" = "index.md" },
  { "Client" = [
    "login.md",
    "records.md",
    "org.md",
    "tui.md",
    "macos.md",
    "agents.md",
    "scripting.md",
    "library.md",
  ] },
  { "cvedexd" = [
    "cvedexd/index.md",
    "cvedexd/deploy.md",
    "cvedexd/submitters.md",
    "cvedexd/review.md",
    "cvedexd/api.md",
  ] },
  { "GitHub repository" = "github.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = { anchor_linenums = true }
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed = { alternate_style = true }
